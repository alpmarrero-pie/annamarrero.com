<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anna Marrero — Experience Designer</title>
<meta name="description" content="Anna Marrero is an experience designer with a strong focus on strategy, systems and service design.">
<meta property="og:title" content="Anna Marrero — Experience Designer">
<meta property="og:description" content="Anna Marrero is an experience designer with a strong focus on strategy, systems and service design.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&amp;family=Manrope:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#FDFDFC}
a{color:#0F2233}a:hover{color:#1F3A52}

/* Frosted glass over the page. The ripple clears it from the centre outward (driven from the
   script below). If the script never runs, it still fades away on its own. */
.hb-frost{animation:hb-safety .8s ease 4.5s forwards}
/* A no-op animation on the page itself: whenever the page is (re)played its start event
   restarts the ripple, even if nothing else is remounted. */
.hb-page{animation:hb-boot .01s both}
@keyframes hb-boot{from{opacity:.999}to{opacity:1}}
@keyframes hb-safety{to{opacity:0;visibility:hidden}}

.hb-nav a{text-decoration:none}
.hb-nav a:hover{text-decoration:underline;text-underline-offset:6px}
.hb-nav a:focus-visible{outline:2px solid #0F2233;outline-offset:4px}
.ft-links a{color:#3D4A57;text-decoration:none}
.ft-links a:hover{color:#0F2233;text-decoration:underline;text-underline-offset:5px}
.ft-links a:focus-visible{outline:2px solid #0F2233;outline-offset:4px}

/* Retro desktop-style button below the intro: square corners, bevelled edges, mono label.
   Pressing flips the bevel and nudges the label, like a classic OS button. */
.hb-btn{display:inline-flex;align-items:center;margin-top:18px;min-height:44px;padding:8px 18px;box-sizing:border-box;border-radius:0;border:1px solid #0F2233;background:#ECEDEE;color:#0F2233;font-family:'IBM Plex Mono','Courier New',monospace;font-size:14px;font-weight:500;letter-spacing:.02em;text-decoration:none;box-shadow:inset 2px 2px 0 #FFFFFF,inset -2px -2px 0 #A3ABB3;cursor:pointer}
.hb-btn:hover{background:#F4F5F6;color:#0F2233}
.hb-btn:active{background:#E2E4E6;box-shadow:inset 2px 2px 0 #A3ABB3,inset -2px -2px 0 #FFFFFF;padding:9px 17px 7px 19px}
.hb-btn:focus-visible{outline:1px dotted #0F2233;outline-offset:-6px}
/* Terminal-style cursor after the intro */
.hb-cursor{display:inline-block;width:.5em;height:.9em;margin-left:.12em;vertical-align:-.08em;background:#0F2233;animation:hb-blink 1.1s steps(1) infinite}
@keyframes hb-blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){
  .hb-frost{display:none}
  .hb-cursor{animation:none}
}
/* Site header: logo placeholder and links in IBM Plex Mono; right side left open */
.hd-logo{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px dashed rgba(15,34,51,.35);font-family:'IBM Plex Mono','Courier New',monospace;font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#4E6578 !important;text-decoration:none !important}
.hd-links{display:flex;flex-wrap:wrap;gap:clamp(18px,2.4vw,28px);font-family:'IBM Plex Mono','Courier New',monospace;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.hd-links a{color:#4E6578 !important;text-decoration:none !important;transition:color .2s ease}
.hd-links a:hover,.hd-links a[aria-current="page"]{color:#0F2233 !important}
</style>
<style>[hidden]{display:none !important}</style>
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
<main class="hb-page" style="position: relative; min-height: 100vh; overflow: hidden; background: #FDFDFC; font-family: 'Manrope', system-ui, sans-serif">
  <svg aria-hidden="true" width="0" height="0" style="position: absolute">
    <filter id="hb-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
    <!-- The ripple: a displacement map, redrawn every frame, that bends whatever sits on the page -->
    <filter id="hb-ripple" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="1440" height="900" color-interpolation-filters="sRGB">
      <feImage id="hb-ripple-map" x="0" y="0" width="1440" height="900" preserveAspectRatio="none" result="map"></feImage>
      <feDisplacementMap in="SourceGraphic" in2="map" scale="38" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
  </svg>

  <!-- The interface surface: everything in here is bent by the ripple as it passes -->
  <div id="hb-surface" style="position: relative; min-height: 100vh">
    <div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(15,34,51,.13) 1px, transparent 1.4px); background-size: 24px 24px; background-position: 12px 12px; pointer-events: none"></div>

    <!-- Top menu, the same as the other pages -->
    <div style="position: absolute; top: 0; left: 0; right: 0; z-index: 2">
      <div style="max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 32px); box-sizing: border-box">
        <header class="hb-nav" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; padding: clamp(14px, 2vw, 20px) 0">
          <div style="display: flex; align-items: center; gap: clamp(20px, 3vw, 36px)">
            <nav class="hd-links" aria-label="Main"><a href="/" aria-current="page">Home</a><a href="/work">Work</a><a href="/about">About</a></nav>
          </div>
          <!-- Right side: intentionally left open -->
          <div aria-hidden="true"></div>
        </header>
      </div>
    </div>

    <!-- Text in a narrow centred column (about 45 characters a line), left-aligned within it -->
    <div style="position: relative; min-height: 100vh; max-width: 1200px; margin: 0 auto; display: flex; align-items: center; padding: 48px clamp(16px, 4vw, 32px); box-sizing: border-box">
      <div style="max-width: 620px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 22px; text-align: left">
        <!-- Intro line set in the same type as the heading, so the two read as one statement -->
        <div style="display: flex; flex-direction: column; align-items: flex-start">
          <h1 class="hb-term" style="margin: 0; font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: clamp(20px, calc(20px + 4 * (100vw - 390px) / 1050), 24px); font-weight: 400; line-height: 1.4; letter-spacing: -0.01em; color: #0F2233; text-wrap: pretty">Hi, I'm Anna Marrero, an experience designer with a strong focus on strategy.<br><br>I think in systems and craft products with a service mindset to support user intent.<span class="hb-cursor" aria-hidden="true"></span></h1>
        </div>
        <p style="margin: 0; max-width: 520px; font-family: 'Newsreader', Georgia, serif; font-size: clamp(20px, calc(20px + 4 * (100vw - 390px) / 1050), 24px); font-style: italic; font-weight: 400; line-height: 1.4; color: #3D4A57">It’s nice to meet you.</p>
        <!-- Link to the Design Philosophy section on the About page -->
        <a class="hb-btn" href="/about#manifesto">Design philosophy</a>
      </div>
    </div>
    <!-- Footer: email and social links on the left, name on the right -->
    <footer style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; border-top: 1px solid rgba(15,34,51,.12)">
      <div style="max-width: 1200px; margin: 0 auto; padding: 22px clamp(16px, 4vw, 32px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; font-family: 'Manrope', system-ui, sans-serif; font-size: 15px; color: #3D4A57">
        <nav class="ft-links" aria-label="Elsewhere" style="display: flex; flex-wrap: wrap; gap: 8px clamp(16px, 2.4vw, 28px)"><a href="mailto:alpmarrero@gmail.com">Email</a><a href="https://x.com/alpmarrero" target="_blank" rel="noopener noreferrer">@alpmarrero on X</a>
          <a href="https://www.linkedin.com/in/alpmarrero/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://www.are.na/anna-marrero" target="_blank" rel="noopener noreferrer">Are.na</a>
        </nav>
        <p style="margin: 0">© Anna Marrero 2026</p>
      </div>
    </footer>
  </div>

  
  <div class="hb-frost" id="hb-frost" aria-hidden="true" style="position: absolute; inset: 0; background: rgba(250,250,249,.62); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); pointer-events: none">
    <svg style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.35; mix-blend-mode: multiply"><rect width="100%" height="100%" filter="url(#hb-grain)"></rect></svg>
  </div>
  
</main>
<script src="/js/ripple.js" defer></script>
</body>
</html>
